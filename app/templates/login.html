{% extends "base.html" %}
{% block content %}
<div class="auth">
  <form class="auth-card" method="post" action="/login">
    <div class="mark">Incident Commander</div>
    <h1>Sign in</h1>
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <label class="field"><span>Email</span><input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus></label>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" type="submit">Sign in</button>
    {% if sso_enabled %}
    <div class="auth-or" aria-hidden="true">or</div>
    <a class="btn" href="/login/oidc">Sign in with {{ sso_display_name or "SSO" }}</a>
    {% endif %}
  </form>
</div>
{% endblock %}
