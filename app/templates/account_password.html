{% extends "base.html" %}
{% block content %}
<div class="auth">
  <form class="auth-card" method="post" action="/account/password">
    <div class="mark">Incident Commander</div>
    <h1>Account</h1>
    <p class="muted" style="margin:-12px 0 18px">Change your password.</p>
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    {% if ask_name %}<label class="field"><span>Your name</span><input type="text" name="name" value="{{ name or '' }}" maxlength="200" autocomplete="name" required autofocus placeholder="e.g. Alice Rossi"></label>{% endif %}
    <p id="password-help" class="muted">Use at least 8 characters. Enter the same password in both fields.</p>
    <label class="field"><span>New password</span><input type="password" name="new_password" minlength="8" autocomplete="new-password" aria-describedby="password-help" required{% if not ask_name %} autofocus{% endif %}></label>
    <label class="field"><span>Confirm password</span><input type="password" name="confirm" minlength="8" autocomplete="new-password" required></label>
    <button class="btn btn-primary" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
